<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FULLMOONBIRDS Directory</title>
<style>
:root{
  --bg:#0b0e14;
  --panel:#161b22;
  --panel2:#10151d;
  --line:#30363d;
  --text:#ffffff;
  --muted:#8a99ad;
  --blue:#58a6ff;
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  margin:0;
  padding:40px 20px 70px;
}
header{text-align:center;margin-bottom:28px}
h1{font-size:2.5rem;margin:0 0 10px;letter-spacing:1px}
.subtitle{color:var(--muted);margin:0 0 28px;font-size:1.1rem}

.toolbar{
  max-width:1400px;
  margin:0 auto 24px;
  display:grid;
  grid-template-columns:minmax(180px,1.2fr) repeat(3,minmax(150px,1fr)) auto;
  gap:10px;
}
input,select,button{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:9px;
  padding:11px 12px;
  font-size:.95rem;
}
button{cursor:pointer}
button:hover,input:focus,select:focus{border-color:var(--blue);outline:none}
.clear-btn{width:auto;min-width:90px}

.status{
  max-width:1400px;
  margin:0 auto 16px;
  color:var(--muted);
  font-size:.9rem;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:20px;
  max-width:1400px;
  margin:0 auto;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  transition:transform .2s,border-color .2s;
  cursor:pointer;
}
.card:hover{transform:translateY(-5px);border-color:var(--blue)}
.card img{
  width:100%;
  height:auto;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
  image-rendering:pixelated;
  display:block;
}
.card-id{
  margin-top:10px;
  font-weight:bold;
  font-size:.9rem;
  color:var(--blue);
  text-align:center;
}
.card-rarity{
  margin-top:5px;
  color:var(--muted);
  font-size:.75rem;
  text-align:center;
}
.rarity-summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}
.rarity-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px;
}
.rarity-label{
  color:var(--muted);
  text-transform:uppercase;
  font-size:.7rem;
  letter-spacing:.06em;
  margin-bottom:5px;
}
.rarity-number{
  color:var(--blue);
  font-size:1.2rem;
  font-weight:700;
}
.trait-frequency{
  margin-top:4px;
  color:var(--muted);
  font-size:.72rem;
}

.pager{
  max-width:1400px;
  margin:28px auto 0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}
.pager button{width:auto;min-width:110px}
.page-text{color:var(--muted);min-width:140px;text-align:center}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}
.modal.open{display:flex}
.modal-card{
  width:min(900px,96vw);
  max-height:92vh;
  overflow:auto;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px;
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}
.modal-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  margin-bottom:18px;
}
.modal-title{font-size:1.45rem;font-weight:700}
.close{
  width:42px;height:42px;padding:0;border-radius:50%;
  font-size:1.4rem;line-height:1;
}
.detail{
  display:grid;
  grid-template-columns:minmax(260px,1fr) minmax(300px,1.25fr);
  gap:26px;
}
.detail-image img{
  width:100%;
  border-radius:12px;
  image-rendering:pixelated;
  display:block;
}
.traits{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.trait{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 12px;
}
.trait-type{
  color:var(--muted);
  text-transform:uppercase;
  font-size:.7rem;
  letter-spacing:.06em;
  margin-bottom:4px;
}
.trait-value{font-weight:600;word-break:break-word}
.inscription{
  margin-top:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px;
}
.inscription-label{
  color:var(--muted);
  text-transform:uppercase;
  font-size:.7rem;
  letter-spacing:.06em;
  margin-bottom:6px;
}
.inscription-id{
  font-family:Consolas,Monaco,monospace;
  font-size:.78rem;
  color:var(--blue);
  word-break:break-all;
}
.modal-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}
.modal-actions button,.modal-actions a{
  flex:1;
  text-align:center;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:9px;
  padding:10px 12px;
  text-decoration:none;
  font-size:.9rem;
}
.modal-actions button:hover,.modal-actions a:hover{border-color:var(--blue)}
.empty{
  max-width:1400px;
  margin:30px auto;
  text-align:center;
  color:var(--muted);
}
@media(max-width:900px){
  .toolbar{grid-template-columns:1fr 1fr}
  .clear-btn{width:100%}
  .detail{grid-template-columns:1fr}
}
@media(max-width:560px){
  body{padding:28px 12px 50px}
  h1{font-size:2rem}
  .toolbar{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .traits{grid-template-columns:1fr}
  .pager{flex-wrap:wrap}
}
</style>
</head>
<body>

<header>
  <h1>FULLMOONBIRDS</h1>
  <p class="subtitle">Official Animated CC0 Directory on Fractal Bitcoin<br>
  <span style="font-size:.82rem">Rarity is calculated mathematically from trait frequencies across all 10,000 birds.</span></p>
</header>

<section class="toolbar">
  <input id="birdSearch" type="text" inputmode="numeric" placeholder="Search bird # (0–9999)">
  <select id="traitType"><option value="">All trait types</option></select>
  <select id="traitValue"><option value="">All trait values</option></select>
  <select id="sort">
    <option value="asc">Number: low to high</option>
    <option value="desc">Number: high to low</option>
    <option value="rarity-desc">Rarity: rarest first</option>
    <option value="rarity-asc">Rarity: commonest first</option>
  </select>
  <button class="clear-btn" id="clearFilters">Clear</button>
</section>

<div class="status" id="status">Loading metadata…</div>
<div class="grid" id="gallery"></div>
<div class="empty" id="empty" hidden>No birds match those filters.</div>

<div class="pager" id="pager">
  <button id="prevPage">← Previous</button>
  <div class="page-text" id="pageText"></div>
  <button id="nextPage">Next →</button>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-top">
      <div class="modal-title" id="modalTitle"></div>
      <button class="close" id="closeModal" aria-label="Close">×</button>
    </div>
    <div class="detail">
      <div class="detail-image"><img id="modalImage" alt=""></div>
      <div>
        <div class="rarity-summary">
          <div class="rarity-box">
            <div class="rarity-label">Rarity Rank</div>
            <div class="rarity-number" id="rarityRank">—</div>
          </div>
          <div class="rarity-box">
            <div class="rarity-label">Rarity Score</div>
            <div class="rarity-number" id="rarityScore">—</div>
          </div>
        </div>
        <div class="traits" id="modalTraits"></div>
        <div class="inscription">
          <div class="inscription-label">Inscription ID</div>
          <div class="inscription-id" id="inscriptionId"></div>
        </div>
        <div class="modal-actions">
          <button id="copyId">Copy inscription ID</button>
          <a id="openGif" href="#" target="_blank" rel="noopener">Open GIF</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const TOTAL_BIRDS = 10000;
const PAGE_SIZE = 120;

const gallery = document.getElementById('gallery');
const statusEl = document.getElementById('status');
const emptyEl = document.getElementById('empty');
const birdSearch = document.getElementById('birdSearch');
const traitType = document.getElementById('traitType');
const traitValue = document.getElementById('traitValue');
const sortSelect = document.getElementById('sort');
const pageText = document.getElementById('pageText');
const prevPage = document.getElementById('prevPage');
const nextPage = document.getElementById('nextPage');
const clearFilters = document.getElementById('clearFilters');

const modal = document.getElementById('modal');
const closeModalBtn = document.getElementById('closeModal');
const modalTitle = document.getElementById('modalTitle');
const modalImage = document.getElementById('modalImage');
const modalTraits = document.getElementById('modalTraits');
const inscriptionId = document.getElementById('inscriptionId');
const rarityRank = document.getElementById('rarityRank');
const rarityScore = document.getElementById('rarityScore');
const copyIdBtn = document.getElementById('copyId');
const openGif = document.getElementById('openGif');

let birds = [];
let filtered = [];
let traitStats = {};
let traitTypes = [];
let currentPage = 1;

function birdNumber(record, index) {
  const name = record?.meta?.name || '';
  const match = name.match(/#(\d+)/);
  return match ? Number(match[1]) : index;
}

function attrs(record) {
  return Array.isArray(record?.meta?.attributes) ? record.meta.attributes : [];
}

function buildTraitTypes() {
  const types = new Set();
  birds.forEach(b => attrs(b).forEach(a => {
    if (a?.trait_type) types.add(String(a.trait_type));
  }));
  [...types].sort((a,b)=>a.localeCompare(b)).forEach(type => {
    const opt = document.createElement('option');
    opt.value = type;
    opt.textContent = type;
    traitType.appendChild(opt);
  });
}

function rebuildTraitValues() {
  traitValue.innerHTML = '<option value="">All trait values</option>';
  const selectedType = traitType.value;
  if (!selectedType) return;
  const values = new Set();
  birds.forEach(b => attrs(b).forEach(a => {
    if (String(a?.trait_type) === selectedType && a?.value !== undefined) {
      values.add(String(a.value));
    }
  }));
  [...values].sort((a,b)=>a.localeCompare(b)).forEach(value => {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = value;
    traitValue.appendChild(opt);
  });
}

function applyFilters(resetPage=true) {
  if (resetPage) currentPage = 1;

  const raw = birdSearch.value.trim().replace(/^#/, '');
  const exactNumber = raw === '' ? null : Number(raw);
  const selectedType = traitType.value;
  const selectedValue = traitValue.value;

  filtered = birds.filter((record, index) => {
    const num = birdNumber(record, index);

    if (exactNumber !== null && Number.isFinite(exactNumber) && num !== exactNumber) {
      return false;
    }

    if (selectedType) {
      const matching = attrs(record).filter(a => String(a?.trait_type) === selectedType);
      if (!matching.length) return false;
      if (selectedValue && !matching.some(a => String(a?.value) === selectedValue)) return false;
    }
    return true;
  });

  filtered.sort((a,b) => {
    const an = birdNumber(a, birds.indexOf(a));
    const bn = birdNumber(b, birds.indexOf(b));
    if (sortSelect.value === 'desc') return bn - an;
    if (sortSelect.value === 'rarity-desc') {
      return (a?.rarity?.rank ?? 999999) - (b?.rarity?.rank ?? 999999);
    }
    if (sortSelect.value === 'rarity-asc') {
      return (b?.rarity?.rank ?? 0) - (a?.rarity?.rank ?? 0);
    }
    return an - bn;
  });

  render();
}

function createCard(record, fallbackIndex) {
  const num = birdNumber(record, fallbackIndex);
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  card.setAttribute('role','button');
  card.setAttribute('aria-label',`Open FullMoonBird #${num}`);

  const img = document.createElement('img');
  img.src = `${num}.gif`;
  img.alt = `FullMoonBird #${num}`;
  img.loading = 'lazy';

  const idText = document.createElement('div');
  idText.className = 'card-id';
  idText.textContent = `#${num}`;

  const rarityText = document.createElement('div');
  rarityText.className = 'card-rarity';
  rarityText.textContent = record?.rarity?.rank ? `Rarity #${record.rarity.rank.toLocaleString()}` : '';

  card.append(img,idText,rarityText);
  card.addEventListener('click',()=>openModal(record,num));
  card.addEventListener('keydown',e=>{
    if(e.key==='Enter' || e.key===' '){e.preventDefault();openModal(record,num);}
  });
  return card;
}

function render() {
  gallery.innerHTML = '';
  emptyEl.hidden = filtered.length !== 0;

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, filtered.length);
  const slice = filtered.slice(start,end);

  slice.forEach((record,i)=>gallery.appendChild(createCard(record,start+i)));

  const shownStart = filtered.length ? start + 1 : 0;
  statusEl.textContent = `${filtered.length.toLocaleString()} bird${filtered.length===1?'':'s'} found · showing ${shownStart.toLocaleString()}–${end.toLocaleString()}`;
  pageText.textContent = `Page ${currentPage.toLocaleString()} of ${totalPages.toLocaleString()}`;
  prevPage.disabled = currentPage <= 1;
  nextPage.disabled = currentPage >= totalPages;

  window.scrollTo({top:0,behavior:'smooth'});
}

function openModal(record,num) {
  modalTitle.textContent = `FULL🦉MOONBIRDS #${num}`;
  modalImage.src = `${num}.gif`;
  modalImage.alt = `FullMoonBird #${num}`;
  modalTraits.innerHTML = '';

  rarityRank.textContent = record?.rarity?.rank
    ? `#${record.rarity.rank.toLocaleString()} / ${record.rarity.total_supply.toLocaleString()}`
    : '—';
  rarityScore.textContent = record?.rarity?.score
    ? Number(record.rarity.score).toFixed(2)
    : '—';

  const attrMap = {};
  attrs(record).forEach(a => {
    if (a?.trait_type != null) attrMap[String(a.trait_type)] = String(a?.value ?? 'None');
  });

  traitTypes.forEach(t => {
    const v = attrMap[t] ?? 'None';
    const count = traitStats?.[t]?.[v] || 0;
    const pct = birds.length ? (count / birds.length) * 100 : 0;

    const box = document.createElement('div');
    box.className = 'trait';

    const type = document.createElement('div');
    type.className = 'trait-type';
    type.textContent = t;

    const value = document.createElement('div');
    value.className = 'trait-value';
    value.textContent = v;

    const freq = document.createElement('div');
    freq.className = 'trait-frequency';
    freq.textContent = `${pct.toFixed(pct < 1 ? 3 : 2)}% · ${count.toLocaleString()} / ${birds.length.toLocaleString()}`;

    box.append(type, value, freq);
    modalTraits.appendChild(box);
  });

  inscriptionId.textContent = record?.id || 'Not available';
  openGif.href = `${num}.gif`;
  copyIdBtn.dataset.id = record?.id || '';
  copyIdBtn.textContent = 'Copy inscription ID';

  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}

function closeModal() {
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  modalImage.src = '';
}

traitType.addEventListener('change',()=>{
  rebuildTraitValues();
  applyFilters();
});
traitValue.addEventListener('change',()=>applyFilters());
sortSelect.addEventListener('change',()=>applyFilters());
birdSearch.addEventListener('input',()=>applyFilters());

clearFilters.addEventListener('click',()=>{
  birdSearch.value='';
  traitType.value='';
  rebuildTraitValues();
  sortSelect.value='asc';
  applyFilters();
});

prevPage.addEventListener('click',()=>{
  if(currentPage>1){currentPage--;render();}
});
nextPage.addEventListener('click',()=>{
  const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  if(currentPage<totalPages){currentPage++;render();}
});

closeModalBtn.addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape' && modal.classList.contains('open'))closeModal();});

copyIdBtn.addEventListener('click',async()=>{
  const id=copyIdBtn.dataset.id;
  if(!id) return;
  try{
    await navigator.clipboard.writeText(id);
    copyIdBtn.textContent='Copied!';
    setTimeout(()=>copyIdBtn.textContent='Copy inscription ID',1300);
  }catch(e){
    copyIdBtn.textContent='Copy failed';
  }
});

fetch('traits.json', {cache:'no-store'})
  .then(r=>{
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(data=>{
    if(!Array.isArray(data)) throw new Error('traits.json is not an array');
    birds=data;
    buildTraitTypes();
    filtered=[...birds];
    applyFilters(false);

    // Deep-link support: ?bird=123
    const params=new URLSearchParams(location.search);
    const requested=params.get('bird');
    if(requested!==null && /^\d+$/.test(requested)){
      birdSearch.value=requested;
      applyFilters();
      if(filtered.length===1) openModal(filtered[0],Number(requested));
    }
  })
  .catch(err=>{
    console.error(err);
    statusEl.textContent='Could not load traits.json. Make sure traits.json is uploaded beside index.html.';
    gallery.innerHTML='';
    emptyEl.hidden=false;
    emptyEl.textContent='Metadata failed to load.';
  });
</script>
</body>
</html>
